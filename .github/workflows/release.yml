name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本名（如 1.2.3；留空则按运行序号生成）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore signing key from secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::缺少签名 Secrets：请在 Settings -> Secrets and variables -> Actions 添加 SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD"
            exit 1
          fi
          mkdir -p signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing/gps-release.jks
          echo "Signing key restored from repository secrets"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.versionName }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version=""
          code=""
          if [[ "$tag" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version="$major.$minor.$patch"
            code=$((major * 10000 + minor * 100 + patch))
          else
            version="${INPUT_VERSION:-${tag#v}}"
            version="${version#v}"
            if [[ -z "$version" ]]; then
              version="0.0.${GITHUB_RUN_NUMBER}"
            fi
            code="${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$version versionCode=$code"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pgps.versionCode=${{ steps.version.outputs.code }} \
            -Pgps.versionName=${{ steps.version.outputs.name }} \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME" \
            --stacktrace

      - name: Rename APK and write checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.name }}"
          apk="GPS-Toolbox-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Toolbox-${{ steps.version.outputs.name }}
          path: |
            GPS-Toolbox-*.apk
            GPS-Toolbox-*.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          append_body: true
          files: |
            GPS-Toolbox-*.apk
            GPS-Toolbox-*.apk.sha256
